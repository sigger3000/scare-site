
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Посмотреть</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
#home{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
h1{font-size:36px}
p{color:#bbb}
button{border:0;border-radius:12px;padding:16px 24px;background:#d90022;color:white;font-size:18px;font-weight:bold}
#screen{display:none;position:fixed;inset:0;background:#000}
#video{width:100%;height:100%;object-fit:contain}
#close{position:absolute;top:15px;right:15px;background:#222;font-size:14px}
</style>
</head>
<body>
<main id="home">
<h1>Ты должен это увидеть.</h1>
<p>Небольшое видео. Готов?</p>
<button id="start">Посмотреть ▶</button>
</main>
<div id="screen">
<video id="video" playsinline preload="auto">
<source src="./scare.mp4" type="video/mp4">
</video>
<button id="close">Закрыть ✕</button>
</div>
<script>
const home=document.getElementById('home');
const screen=document.getElementById('screen');
const video=document.getElementById('video');

document.getElementById('start').onclick=async()=>{
home.style.display='none';
screen.style.display='block';
video.muted=false;
try{
await video.play();
}catch(e){
screen.style.display='none';
home.style.display='flex';
alert('Видео не запустилось. Проверь имя файла и попробуй ещё раз.');
}
};

document.getElementById('close').onclick=()=>{
video.pause();
video.currentTime=0;
screen.style.display='none';
home.style.display='flex';
};
</script>
</body>
</html>
