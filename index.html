
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Посмотреть</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}
#home{text-align:center;padding:24px}
h1{font-size:38px}
p{color:#bbb}
button{border:0;border-radius:12px;padding:17px 26px;background:#d90022;color:white;font-size:18px;font-weight:bold}
#scare{display:none;position:fixed;inset:0;background:#080000;align-items:center;justify-content:center;overflow:hidden}
#scare.show{display:flex;animation:flash .18s 3}
@keyframes flash{50%{background:white}}
.face{width:85vw;height:85vw;max-width:600px;max-height:600px;border-radius:48%;background:radial-gradient(ellipse,#ddd 0%,#555 35%,#080808 70%);position:relative;animation:slam .2s}
@keyframes slam{from{transform:scale(.1)}to{transform:scale(1)}}
.eye{position:absolute;top:30%;width:25%;height:14%;background:#050505;border-radius:50%;box-shadow:0 0 22px red}
.left{left:15%}.right{right:15%}
.mouth{position:absolute;left:23%;top:58%;width:54%;height:25%;background:#050000;border:4px solid #250000;border-radius:10% 10% 45% 45%}
.teeth{height:35%;background:repeating-linear-gradient(90deg,#eee 0 10%,#111 10% 13%)}
#close{position:absolute;top:20px;right:15px;font-size:14px;background:#333}
</style>
</head>
<body>
<main id="home">
<div style="color:#aaa;letter-spacing:4px">КОРОТКОЕ ВИДЕО</div>
<h1>Ты должен это увидеть.</h1>
<p>Небольшой ролик. Готов?</p>
<button id="start">Посмотреть ▶</button>
</main>
<section id="scare">
<div class="face">
<div class="eye left"></div>
<div class="eye right"></div>
<div class="mouth"><div class="teeth"></div></div>
</div>
<button id="close">Закрыть ✕</button>
</section>
<script>
const home=document.getElementById('home');
const scare=document.getElementById('scare');
let ctx;
document.getElementById('start').onclick=()=>{
home.style.display='none';
scare.classList.add('show');
try{
ctx=new(window.AudioContext||window.webkitAudioContext)();
ctx.resume();
[110,155,440].forEach((f,i)=>{
const o=ctx.createOscillator(),g=ctx.createGain();
o.type=i===2?'sawtooth':'triangle';
o.frequency.setValueAtTime(f*2,ctx.currentTime);
o.frequency.exponentialRampToValueAtTime(f,ctx.currentTime+.65);
g.gain.setValueAtTime(.18,ctx.currentTime);
g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1);
o.connect(g);g.connect(ctx.destination);
o.start();o.stop(ctx.currentTime+1);
});
}catch(e){}
};
document.getElementById('close').onclick=()=>{
scare.classList.remove('show');
home.style.display='block';
if(ctx)ctx.close();
};
</script>
</body>
</html>
